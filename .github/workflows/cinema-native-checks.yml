name: Native UI smoke tests
on:
  push:
    branches: [feat/native-netflix-shell]
  pull_request:
jobs:
  syntax-and-invariants:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_cinema_native.py' -v
      - run: bash -n tools/build.sh tools/build-cinema.sh tools/package.sh
